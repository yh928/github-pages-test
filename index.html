<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEBULA STRIKE — 우주 슈팅 게임</title>
<style>
  :root {
    --cyan: #22d3ee;
    --magenta: #e879f9;
    --yellow: #fbbf24;
    --danger: #f87171;
    --bg: #020617;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    color: #e2e8f0;
    user-select: none;
  }
  #game-wrap {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; background: #020617; }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 22px;
    pointer-events: none;
    font-size: 15px; letter-spacing: 1px;
  }
  .hud-box {
    background: rgba(8, 15, 35, .55);
    border: 1px solid rgba(34, 211, 238, .35);
    border-radius: 10px;
    padding: 8px 16px;
    backdrop-filter: blur(4px);
    box-shadow: 0 0 18px rgba(34, 211, 238, .12) inset;
  }
  .hud-label { font-size: 11px; color: #7dd3fc; text-transform: uppercase; letter-spacing: 2px; }
  .hud-value { font-size: 20px; font-weight: 700; color: #f0fdff; text-shadow: 0 0 10px rgba(34,211,238,.8); }
  #lives .hud-value { color: var(--magenta); text-shadow: 0 0 10px rgba(232,121,249,.8); font-size: 17px; letter-spacing: 3px; }
  #wave-box .hud-value { color: var(--yellow); text-shadow: 0 0 10px rgba(251,191,36,.8); }

  #power-bar-wrap {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    width: 320px; height: 10px;
    background: rgba(255,255,255,.08);
    border-radius: 6px;
    border: 1px solid rgba(34,211,238,.3);
    overflow: hidden;
    pointer-events: none;
  }
  #power-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    box-shadow: 0 0 12px rgba(34,211,238,.9);
    transition: width .15s ease;
  }
  #power-label {
    position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 2px; color: #7dd3fc;
    pointer-events: none; opacity: 0; transition: opacity .3s;
  }

  /* ---------- Overlays ---------- */
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(2,6,23,.75) 0%, rgba(2,6,23,.95) 100%);
    z-index: 10;
    text-align: center;
    transition: opacity .4s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .title {
    font-size: clamp(42px, 7vw, 76px);
    font-weight: 800;
    letter-spacing: 8px;
    background: linear-gradient(180deg, #f0fdff 20%, var(--cyan) 60%, #0ea5e9 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 22px rgba(34,211,238,.55));
    margin-bottom: 6px;
  }
  .subtitle { color: #94a3b8; letter-spacing: 4px; font-size: 14px; margin-bottom: 34px; }
  .btn {
    pointer-events: auto;
    cursor: pointer;
    font-size: 17px; font-weight: 700; letter-spacing: 3px;
    color: #04121a;
    background: linear-gradient(180deg, #67e8f9, var(--cyan));
    border: none; border-radius: 999px;
    padding: 14px 46px;
    box-shadow: 0 0 26px rgba(34,211,238,.55);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 38px rgba(34,211,238,.85); }
  .btn:active { transform: scale(.97); }
  .help { margin-top: 30px; color: #64748b; font-size: 13px; line-height: 2; letter-spacing: 1px; }
  .help b { color: #cbd5e1; background: rgba(148,163,184,.15); border: 1px solid rgba(148,163,184,.3); border-radius: 5px; padding: 2px 8px; margin: 0 3px; }
  .final-score { font-size: 46px; font-weight: 800; color: #f0fdff; text-shadow: 0 0 18px rgba(34,211,238,.8); margin: 10px 0 4px; }
  .final-label { color: #7dd3fc; letter-spacing: 3px; font-size: 13px; }
  .best-line { color: var(--yellow); margin-top: 6px; font-size: 14px; letter-spacing: 1px; }
  .new-best { color: var(--magenta); font-weight: 700; animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: .6; } to { opacity: 1; } }
  #pause-badge {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 40px; letter-spacing: 12px; font-weight: 800; color: rgba(226,232,240,.85);
    text-shadow: 0 0 24px rgba(34,211,238,.8);
    display: none; z-index: 9; pointer-events: none;
  }
  #wave-announce {
    position: absolute; top: 32%; left: 50%; transform: translate(-50%,-50%);
    font-size: 34px; font-weight: 800; letter-spacing: 10px; color: var(--yellow);
    text-shadow: 0 0 26px rgba(251,191,36,.9);
    opacity: 0; pointer-events: none; z-index: 8;
    transition: opacity .3s;
  }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-box" id="score-box">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="score">0</div>
    </div>
    <div class="hud-box" id="wave-box">
      <div class="hud-label">Wave</div>
      <div class="hud-value" id="wave">1</div>
    </div>
    <div class="hud-box" id="lives">
      <div class="hud-label">Lives</div>
      <div class="hud-value" id="lives-val">♥♥♥</div>
    </div>
  </div>

  <div id="power-label">WAVE CHARGE</div>
  <div id="power-bar-wrap"><div id="power-bar"></div></div>
  <div id="wave-announce"></div>
  <div id="pause-badge">PAUSED</div>

  <!-- Start screen -->
  <div class="overlay" id="start-screen">
    <div class="title">NEBULA STRIKE</div>
    <div class="subtitle">— DEEP SPACE SHOOTER —</div>
    <button class="btn" id="start-btn">START</button>
    <div class="help">
      <b>← →</b> 또는 <b>A D</b> 이동 &nbsp; <b>Space</b> 발사 &nbsp; <b>P</b> 일시정지<br/>
      적을 격파하면 <b>파워업</b> 드랍 — <span style="color:var(--magenta)">◆ 3WAY</span> ·
      <span style="color:var(--yellow)">◆ RAPID</span> · <span style="color:#4ade80">◆ SHIELD</span>
    </div>
  </div>

  <!-- Game over screen -->
  <div class="overlay hidden" id="over-screen">
    <div class="title" style="font-size:clamp(34px,5vw,56px)">GAME OVER</div>
    <div class="final-label">FINAL SCORE</div>
    <div class="final-score" id="final-score">0</div>
    <div class="best-line" id="best-line"></div>
    <div style="height:26px"></div>
    <button class="btn" id="retry-btn">RETRY</button>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   NEBULA STRIKE — single-file canvas space shooter
   ============================================================ */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const UI = {
  score: document.getElementById("score"),
  wave: document.getElementById("wave"),
  lives: document.getElementById("lives-val"),
  powerBar: document.getElementById("power-bar"),
  powerLabel: document.getElementById("power-label"),
  startScreen: document.getElementById("start-screen"),
  overScreen: document.getElementById("over-screen"),
  finalScore: document.getElementById("final-score"),
  bestLine: document.getElementById("best-line"),
  pauseBadge: document.getElementById("pause-badge"),
  waveAnnounce: document.getElementById("wave-announce"),
};

let W = 0, H = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  buildStars();
}
window.addEventListener("resize", resize);

/* ---------------- Starfield ---------------- */
let stars = [];
function buildStars() {
  stars = [];
  const n = Math.floor((W * H) / 6000);
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      z: Math.random(), // 0..1 depth
    });
  }
}
function updateStars(dt) {
  const speed = 120 + (game.wave * 8);
  for (const s of stars) {
    s.y += speed * (0.25 + s.z * 0.9) * dt;
    if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
  }
}
function drawStars() {
  for (const s of stars) {
    const a = 0.25 + s.z * 0.75;
    ctx.globalAlpha = a;
    ctx.fillStyle = s.z > 0.8 ? "#bae6fd" : "#e2e8f0";
    const r = 0.6 + s.z * 1.4;
    ctx.fillRect(s.x, s.y, r, r * (1 + s.z * 1.6));
  }
  ctx.globalAlpha = 1;
}

/* ---------------- Input ---------------- */
const keys = Object.create(null);
window.addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === "KeyP" && (game.state === "play" || game.state === "pause")) {
    game.state = game.state === "play" ? "pause" : "play";
    UI.pauseBadge.style.display = game.state === "pause" ? "block" : "none";
  }
  if (e.code === "Enter" || e.code === "Space") {
    if (game.state === "menu") startGame();
    if (game.state === "over") startGame();
  }
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

/* ---------------- Audio (tiny synth, no assets) ---------------- */
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  return actx;
}
function beep(freq, dur, type = "square", vol = 0.05, slide = 0) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
const sfx = {
  shoot:  () => beep(720, .08, "square", .03, -380),
  hit:    () => beep(180, .18, "sawtooth", .07, -120),
  boom:   () => beep(90, .35, "sawtooth", .09, -60),
  power:  () => { beep(440, .1, "sine", .06); setTimeout(() => beep(660, .12, "sine", .06), 90); setTimeout(() => beep(880, .16, "sine", .06), 180); },
  hurt:   () => beep(140, .4, "sawtooth", .1, -100),
  wave:   () => { beep(523, .12, "triangle", .06); setTimeout(() => beep(784, .2, "triangle", .06), 120); },
};

/* ---------------- Game state ---------------- */
const game = {
  state: "menu", // menu | play | pause | over
  score: 0,
  best: +(localStorage.getItem("nebula_best") || 0),
  wave: 0,
  lives: 3,
  shake: 0,
  time: 0,
  waveKills: 0,
  waveNeed: 10,
  enemiesAlive: 0,
  spawnTimer: 0,
};

const player = {
  x: 0, y: 0, r: 14, speed: 460,
  cooldown: 0, fireRate: 0.16,
  power: 0,            // 0..1 wave charge
  threeWayUntil: 0,
  rapidUntil: 0,
  shieldUntil: 0,
  invulnUntil: 0,
  thrust: 0,
};

let bullets = [], enemyBullets = [], enemies = [], particles = [], powerups = [];

function resetGame() {
  game.score = 0; game.lives = 3; game.wave = 0;
  game.waveKills = 0; game.waveNeed = 10; game.spawnTimer = 0; game.enemiesAlive = 0;
  game.shake = 0; game.time = 0;
  player.x = W / 2; player.y = H - 90;
  player.cooldown = 0; player.fireRate = 0.16;
  player.power = 0;
  player.threeWayUntil = 0; player.rapidUntil = 0;
  player.shieldUntil = 0; player.invulnUntil = 1.5;
  bullets = []; enemyBullets = []; enemies = []; particles = []; powerups = [];
  updateHUD();
  nextWave();
}

/* ---------------- Waves ---------------- */
function nextWave() {
  game.wave++;
  game.waveNeed = 8 + game.wave * 4;
  game.waveKills = 0;
  UI.wave.textContent = game.wave;
  UI.powerLabel.style.opacity = 1;
  sfx.wave();
  const el = UI.waveAnnounce;
  el.textContent = "WAVE " + game.wave;
  el.style.opacity = 1;
  setTimeout(() => { el.style.opacity = 0; }, 1600);
}

/* ---------------- Spawning ---------------- */
const ENEMY_TYPES = [
  // 0: drone, 1: zigzag, 2: gunner, 3: heavy
  { r: 16, hp: 1,  score: 100, speed: 90,  color: "#e879f9", shoot: false },
  { r: 15, hp: 1,  score: 150, speed: 130, color: "#c084fc", shoot: false, zig: true },
  { r: 17, hp: 2,  score: 250, speed: 70,  color: "#fb923c", shoot: true },
  { r: 26, hp: 5,  score: 500, speed: 45,  color: "#f87171", shoot: true, heavy: true },
];

function pickType() {
  const w = game.wave;
  const pool = [ [0, 10], [1, w >= 2 ? 5 : 0], [2, w >= 3 ? 4 : 0], [3, w >= 5 ? 2 : 0] ]
    .filter(p => p[1] > 0)
    .flatMap(([t, n]) => Array(n).fill(t));
  return pool[Math.floor(Math.random() * pool.length)];
}

function spawnEnemy() {
  const t = pickType();
  const def = ENEMY_TYPES[t];
  const x = 50 + Math.random() * (W - 100);
  enemies.push({
    type: t,
    x, y: -def.r - 10,
    vx: 0, vy: def.speed * (1 + game.wave * 0.04),
    hp: def.hp + Math.floor(game.wave / 4),
    r: def.r,
    color: def.color,
    score: def.score,
    zig: def.zig,
    shoot: def.shoot,
    heavy: def.heavy,
    t: Math.random() * Math.PI * 2,
    shootTimer: 1 + Math.random() * 1.5,
    spin: Math.random() < .5 ? 1 : -1,
  });
  game.enemiesAlive++;
}

/* ---------------- Particles ---------------- */
function burst(x, y, color, n = 18, speed = 260) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.3 + Math.random() * 0.7);
    particles.push({
      x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.5 + Math.random() * 0.4,
      max: 0.9, color,
      r: 1.5 + Math.random() * 2.5,
    });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.98; p.vy *= 0.98;
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------------- Powerups ---------------- */
const PU = { THREE: "three", RAPID: "rapid", SHIELD: "shield" };
function dropPowerup(x, y) {
  const roll = Math.random();
  const kind = roll < 0.4 ? PU.THREE : roll < 0.75 ? PU.RAPID : PU.SHIELD;
  const colors = { [PU.THREE]: "#e879f9", [PU.RAPID]: "#fbbf24", [PU.SHIELD]: "#4ade80" };
  powerups.push({ x, y, kind, vy: 90, r: 11, color: colors[kind], t: 0 });
}
function applyPowerup(pu) {
  sfx.power();
  burst(pu.x, pu.y, pu.color, 24, 300);
  if (pu.kind === PU.THREE) player.threeWayUntil = game.time + 10;
  if (pu.kind === PU.RAPID) player.rapidUntil = game.time + 8;
  if (pu.kind === PU.SHIELD) player.shieldUntil = game.time + 6;
}

/* ---------------- Combat ---------------- */
function firePlayer() {
  const rapid = game.time < player.rapidUntil;
  const rate = rapid ? player.fireRate * 0.5 : player.fireRate;
  if (player.cooldown > 0) return;
  player.cooldown = rate;
  sfx.shoot();
  const mk = (angle, dx = 0) => bullets.push({
    x: player.x + dx, y: player.y - 18,
    vx: Math.sin(angle) * 720, vy: -Math.cos(angle) * 720,
    r: 4, from: "player",
  });
  mk(0);
  if (game.time < player.threeWayUntil) { mk(-0.22, -8); mk(0.22, 8); }
  // muzzle flash
  particles.push({ x: player.x, y: player.y - 20, vx: 0, vy: -120, life: .1, max: .1, color: "#a5f3fc", r: 5 });
}

function fireEnemy(e) {
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  const sp = 200 + game.wave * 10;
  enemyBullets.push({
    x: e.x, y: e.y + e.r,
    vx: dx / d * sp, vy: dy / d * sp,
    r: 5,
  });
  beep(300, .09, "sawtooth", .025, -140);
}

function hitPlayer() {
  if (game.time < player.invulnUntil) return;
  if (game.time < player.shieldUntil) {
    player.shieldUntil = 0; // shield absorbs one hit
    player.invulnUntil = game.time + 1.2;
    sfx.hurt();
    game.shake = 8;
    burst(player.x, player.y, "#4ade80", 20);
    return;
  }
  game.lives--;
  game.shake = 16;
  sfx.hurt();
  burst(player.x, player.y, "#22d3ee", 34, 340);
  player.invulnUntil = game.time + 2;
  player.threeWayUntil = 0; player.rapidUntil = 0; // lose temp powers
  updateHUD();
  if (game.lives <= 0) gameOver();
}

function gameOver() {
  game.state = "over";
  const isBest = game.score > game.best;
  if (isBest) { game.best = game.score; localStorage.setItem("nebula_best", game.best); }
  UI.finalScore.textContent = game.score.toLocaleString();
  UI.bestLine.innerHTML = isBest
    ? '★ NEW BEST — ' + game.best.toLocaleString()
    : 'BEST — ' + game.best.toLocaleString();
  UI.bestLine.classList.toggle("new-best", isBest);
  UI.overScreen.classList.remove("hidden");
}

/* ---------------- Update ---------------- */
function update(dt) {
  game.time += dt;
  updateStars(dt);
  updateParticles(dt);
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 40);

  if (game.state !== "play") return;

  // player move
  let mx = 0, my = 0;
  if (keys.ArrowLeft || keys.KeyA) mx -= 1;
  if (keys.ArrowRight || keys.KeyD) mx += 1;
  if (keys.ArrowUp || keys.KeyW) my -= 1;
  if (keys.ArrowDown || keys.KeyS) my += 1;
  if (mx && my) { mx *= 0.7071; my *= 0.7071; }
  player.x = Math.max(24, Math.min(W - 24, player.x + mx * player.speed * dt));
  player.y = Math.max(H * 0.45, Math.min(H - 30, player.y + my * player.speed * dt));
  player.thrust += dt * 30;

  // shooting
  player.cooldown -= dt;
  if (keys.Space) firePlayer();

  // wave charge
  const charge = game.waveKills / game.waveNeed;
  player.power = charge;
  UI.powerBar.style.width = (charge * 100).toFixed(1) + "%";
  if (charge >= 1) { nextWave(); UI.powerLabel.style.opacity = 0; }

  // spawning
  const maxAlive = Math.min(4 + game.wave, 14);
  game.spawnTimer -= dt;
  if (game.spawnTimer <= 0 && game.enemiesAlive < maxAlive) {
    spawnEnemy();
    game.spawnTimer = Math.max(0.35, 1.6 - game.wave * 0.1);
  }

  // bullets (player)
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -20 || b.x < -20 || b.x > W + 20) bullets.splice(i, 1);
  }
  // enemy bullets
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20) { enemyBullets.splice(i, 1); continue; }
    if (Math.hypot(b.x - player.x, b.y - player.y) < b.r + player.r - 4) {
      enemyBullets.splice(i, 1);
      hitPlayer();
    }
  }

  // enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.t += dt * 3;
    if (e.zig) e.x += Math.sin(e.t * 2.2) * 140 * dt;
    e.x = Math.max(e.r, Math.min(W - e.r, e.x));
    e.y += e.vy * dt;
    if (e.y > H + 40) { enemies.splice(i, 1); game.enemiesAlive--; continue; }

    if (e.shoot) {
      e.shootTimer -= dt;
      if (e.shootTimer <= 0 && e.y > 0 && e.y < H * 0.7) {
        fireEnemy(e);
        e.shootTimer = (e.heavy ? 1.1 : 2) + Math.random() * 1.2 - Math.min(0.6, game.wave * 0.05);
      }
    }

    // collide with player
    if (Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r - 4) {
      enemies.splice(i, 1); game.enemiesAlive--;
      burst(e.x, e.y, e.color, 16);
      hitPlayer();
      continue;
    }

    // bullets hit
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.r) {
        bullets.splice(j, 1);
        e.hp--;
        burst(b.x, b.y, "#a5f3fc", 5, 140);
        if (e.hp <= 0) {
          enemies.splice(i, 1);
          game.enemiesAlive--;
          game.waveKills++;
          game.score += e.score;
          game.shake = Math.max(game.shake, e.heavy ? 10 : 5);
          (e.heavy ? sfx.boom : sfx.hit)();
          burst(e.x, e.y, e.color, e.heavy ? 40 : 22, e.heavy ? 380 : 280);
          if (Math.random() < 0.12 || e.heavy) dropPowerup(e.x, e.y);
          updateHUD();
        } else {
          sfx.hit();
        }
        break;
      }
    }
  }

  // powerups
  for (let i = powerups.length - 1; i >= 0; i--) {
    const pu = powerups[i];
    pu.t += dt;
    pu.y += pu.vy * dt;
    if (pu.y > H + 30) { powerups.splice(i, 1); continue; }
    if (Math.hypot(pu.x - player.x, pu.y - player.y) < pu.r + player.r + 4) {
      powerups.splice(i, 1);
      applyPowerup(pu);
    }
  }
}

/* ---------------- Draw ---------------- */
function drawPlayer() {
  const p = player;
  const blink = game.time < p.invulnUntil && Math.floor(game.time * 12) % 2 === 0;
  ctx.save();
  ctx.translate(p.x, p.y);

  // engine flame
  const fl = 10 + Math.sin(p.thrust) * 4;
  const grad = ctx.createLinearGradient(0, 14, 0, 14 + fl + 14);
  grad.addColorStop(0, "rgba(165,243,252,.95)");
  grad.addColorStop(1, "rgba(34,211,238,0)");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-6, 14); ctx.lineTo(6, 14); ctx.lineTo(0, 14 + fl + 14);
  ctx.closePath(); ctx.fill();

  if (blink) ctx.globalAlpha = 0.4;

  // ship body
  ctx.shadowColor = "#22d3ee"; ctx.shadowBlur = 18;
  ctx.fillStyle = "#e0f2fe";
  ctx.beginPath();
  ctx.moveTo(0, -20);
  ctx.lineTo(13, 12);
  ctx.lineTo(5, 7);
  ctx.lineTo(0, 12);
  ctx.lineTo(-5, 7);
  ctx.lineTo(-13, 12);
  ctx.closePath();
  ctx.fill();
  // cockpit
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#0ea5e9";
  ctx.beginPath();
  ctx.ellipse(0, -4, 3.5, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // shield ring
  if (game.time < p.shieldUntil) {
    const alpha = game.time > p.shieldUntil - 1.5 ? (Math.floor(game.time * 10) % 2 ? .35 : .8) : .8;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = "#4ade80";
    ctx.lineWidth = 2.5;
    ctx.shadowColor = "#4ade80"; ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(0, -2, 26, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(Math.sin(e.t) * 0.15 * (e.zig ? 3 : 1) * e.spin);
  ctx.shadowColor = e.color; ctx.shadowBlur = 14;
  ctx.fillStyle = e.color;

  if (e.heavy) {
    // hexagon
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + e.t * 0.3;
      const x = Math.cos(a) * e.r, y = Math.sin(a) * e.r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(2,6,23,.65)";
    ctx.beginPath(); ctx.arc(0, 0, e.r * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = e.color;
    ctx.beginPath(); ctx.arc(0, 0, e.r * 0.22, 0, Math.PI * 2); ctx.fill();
  } else {
    // inverted ship
    ctx.beginPath();
    ctx.moveTo(0, e.r);
    ctx.lineTo(-e.r, -e.r * 0.7);
    ctx.lineTo(-e.r * 0.35, -e.r * 0.3);
    ctx.lineTo(0, -e.r * 0.6);
    ctx.lineTo(e.r * 0.35, -e.r * 0.3);
    ctx.lineTo(e.r, -e.r * 0.7);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(2,6,23,.6)";
    ctx.beginPath(); ctx.arc(0, -e.r * 0.15, e.r * 0.28, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // hp bar for damaged enemies
  const maxHp = ENEMY_TYPES[e.type].hp + Math.floor(game.wave / 4);
  if (e.hp < maxHp) {
    const w = e.r * 2;
    ctx.fillStyle = "rgba(255,255,255,.15)";
    ctx.fillRect(e.x - w / 2, e.y - e.r - 10, w, 4);
    ctx.fillStyle = e.color;
    ctx.fillRect(e.x - w / 2, e.y - e.r - 10, w * (e.hp / maxHp), 4);
  }
}

function drawPowerup(pu) {
  const pulse = 1 + Math.sin(pu.t * 6) * 0.15;
  ctx.save();
  ctx.translate(pu.x, pu.y);
  ctx.scale(pulse, pulse);
  ctx.rotate(pu.t * 1.5);
  ctx.shadowColor = pu.color; ctx.shadowBlur = 16;
  ctx.fillStyle = pu.color;
  ctx.beginPath();
  ctx.moveTo(0, -pu.r); ctx.lineTo(pu.r, 0); ctx.lineTo(0, pu.r); ctx.lineTo(-pu.r, 0);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#020617";
  ctx.font = "bold 11px monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.rotate(-pu.t * 1.5);
  const label = { [PU.THREE]: "3", [PU.RAPID]: "R", [PU.SHIELD]: "S" }[pu.kind];
  ctx.fillText(label, 0, 1);
  ctx.restore();
}

function drawBullets() {
  // player bullets
  for (const b of bullets) {
    ctx.shadowColor = "#22d3ee"; ctx.shadowBlur = 10;
    ctx.fillStyle = "#a5f3fc";
    ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
  }
  ctx.shadowBlur = 0;
  // enemy bullets
  for (const b of enemyBullets) {
    ctx.shadowColor = "#f87171"; ctx.shadowBlur = 10;
    ctx.fillStyle = "#fca5a5";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (game.shake > 0) {
    ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
  }

  drawStars();
  for (const pu of powerups) drawPowerup(pu);
  for (const e of enemies) drawEnemy(e);
  drawBullets();
  if (game.state === "play" || game.state === "pause") drawPlayer();
  drawParticles();

  // vignette
  const v = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.85);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(0,0,0,.45)");
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

/* ---------------- HUD ---------------- */
function updateHUD() {
  UI.score.textContent = game.score.toLocaleString();
  UI.wave.textContent = game.wave;
  UI.lives.textContent = "♥".repeat(Math.max(0, game.lives)) || "—";
}

/* ---------------- Loop ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (game.state === "play" || game.state === "menu") update(dt);
  else if (game.state === "pause") { /* frozen */ }
  else if (game.state === "over") { updateStars(dt); updateParticles(dt); if (game.shake > 0) game.shake = Math.max(0, game.shake - dt*40); }
  draw();
  requestAnimationFrame(loop);
}

/* ---------------- Wiring ---------------- */
function startGame() {
  audio();
  if (actx && actx.state === "suspended") actx.resume();
  UI.startScreen.classList.add("hidden");
  UI.overScreen.classList.add("hidden");
  UI.pauseBadge.style.display = "none";
  resetGame();
  game.state = "play";
}
document.getElementById("start-btn").addEventListener("click", startGame);
document.getElementById("retry-btn").addEventListener("click", startGame);

/* ---------------- Boot ---------------- */
resize();
player.x = W / 2; player.y = H - 90;
requestAnimationFrame(loop);
</script>
</body>
</html>
